name: Build portable tools

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to build
        required: true
        default: all
        type: choice
        options:
          - all
          - tmux
          - jq
          - neovim

permissions:
  contents: read

jobs:
  tmux:
    name: tmux / el7-amd64
    if: github.event_name != 'workflow_dispatch' || inputs.tool == 'all' || inputs.tool == 'tmux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build tmux
        run: bash ./scripts/build-tool.sh tmux el7-amd64
      - name: Verify artifact
        run: test -s dist/tmux-3.7b-el7-amd64.tar.gz && tar tzf dist/tmux-3.7b-el7-amd64.tar.gz >/dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmux-el7-amd64
          path: dist/tmux-3.7b-el7-amd64.tar.gz
          if-no-files-found: error

  jq:
    name: jq / el7-amd64
    if: github.event_name != 'workflow_dispatch' || inputs.tool == 'all' || inputs.tool == 'jq'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build jq
        run: bash ./scripts/build-tool.sh jq el7-amd64
      - name: Verify artifact
        run: test -s dist/jq-1.8.2-el7-amd64.tar.gz && tar tzf dist/jq-1.8.2-el7-amd64.tar.gz >/dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jq-el7-amd64
          path: dist/jq-1.8.2-el7-amd64.tar.gz
          if-no-files-found: error

  neovim:
    name: neovim / el7-amd64
    if: github.event_name != 'workflow_dispatch' || inputs.tool == 'all' || inputs.tool == 'neovim'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build Neovim
        run: bash ./scripts/build-tool.sh neovim el7-amd64
      - name: Verify artifact
        run: test -s dist/neovim-0.12.4-el7-amd64.tar.gz && tar tzf dist/neovim-0.12.4-el7-amd64.tar.gz >/dev/null
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neovim-el7-amd64
          path: dist/neovim-0.12.4-el7-amd64.tar.gz
          if-no-files-found: error
