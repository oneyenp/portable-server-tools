name: Build portable tools

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to build
        required: true
        default: all
        type: choice
        options:
          - all
          - tmux
          - jq
          - neovim
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.tool }} / ${{ matrix.target }}
    if: github.event_name != 'workflow_dispatch' || inputs.tool == 'all' || inputs.tool == matrix.tool
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: tmux
            target: el7-amd64
          - tool: jq
            target: el7-amd64
          - tool: neovim
            target: el7-amd64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: bash ./scripts/build-tool.sh "${{ matrix.tool }}" "${{ matrix.target }}"

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
